<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord Image Link Generator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        max-width: 700px;
        margin: 60px auto;
        padding: 20px;
    }

    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin: 8px 0 18px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #222;
        color: white;
    }

    button {
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 6px;
        background: #5865F2;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #4752C4;
    }

    #result {
        margin-top: 20px;
        display: none;
    }

    textarea {
        width: 100%;
        height: 90px;
        box-sizing: border-box;
        margin-top: 10px;
        background: #222;
        color: white;
        border: 1px solid #444;
        padding: 10px;
        resize: none;
    }

    img {
        max-width: 100%;
        max-height: 300px;
        display: block;
        margin-top: 20px;
    }
</style>
</head>

<body>

<h1>Discord Image Link Generator</h1>

<label>Image / GIF URL</label>

<input
    id="image"
    type="url"
    placeholder="https://example.com/image.gif"
>

<label>Redirect URL</label>

<input
    id="redirect"
    type="url"
    placeholder="https://example.com/"
>

<button onclick="generate()">
    Generate Link
</button>

<div id="result">

    <h3>Your link:</h3>

    <textarea id="output" readonly></textarea>

    <button onclick="copyLink()">
        Copy Link
    </button>

    <img id="preview">

</div>

<script>

const WORKER_URL =
    "https://discord-image-redirect.bmanb0201.workers.dev/";

function generate() {

    const image =
        document.getElementById("image").value.trim();

    const redirect =
        document.getElementById("redirect").value.trim();

    if (!image || !redirect) {
        alert("Enter both URLs.");
        return;
    }

    try {
        new URL(image);
        new URL(redirect);
    } catch {
        alert("Please enter valid URLs.");
        return;
    }

    const finalURL =
        WORKER_URL +
        "?image=" +
        encodeURIComponent(image) +
        "&redirect=" +
        encodeURIComponent(redirect);

    document.getElementById("output").value = finalURL;

    document.getElementById("preview").src = image;

    document.getElementById("result").style.display = "block";
}

function copyLink() {

    const output =
        document.getElementById("output");

    output.select();

    navigator.clipboard.writeText(output.value);

    alert("Copied!");
}

</script>

</body>
</html>
